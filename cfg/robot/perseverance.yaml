# @package environment
# do not remove the above comment, it injects the settings below into the environment config

robots_settings:
  # NOTE: robots_root is /World rather than the usual /Robots on purpose. The joints inside
  # rover_with_sensors.usd reference their bodies through absolute /World/perseverance/... paths,
  # so the rover must land at exactly /World/perseverance or every joint breaks. Robot.robot_path
  # is built as os.path.join(robots_root, robot_name).
  robots_root: "/World"
  parameters:
    robot_name: perseverance
    usd_path: my_files/rover_with_sensors.usd
    # rover_with_sensors.usd declares no default prim, so the reference has to be targeted
    # explicitly (see Robot.load).
    usd_prim_path: "/World/perseverance"
    scale: 0.35
    pose:
      position: [10., 10., 3.]
      orientation: [1., 0., 0., 0.]
    base_link: "body" # core link used to determine the position of the robot
    target_links: [
      "wheel_front_left",
      "wheel_front_right",
      "wheel_mid_left",
      "wheel_mid_right",
      "wheel_rear_left",
      "wheel_rear_right"
    ]
    wheel_joints:
      left: ["drive_joint_front_left", "drive_joint_mid_left", "drive_joint_rear_left"]
      right: ["drive_joint_front_right", "drive_joint_mid_right", "drive_joint_rear_right"]
    # Physics overrides, applied to the usd before PhysX parses the rover (Robot.install_physics_overrides).
    physics:
      # A still articulation otherwise goes to sleep, and then reports no wheel contact and a frozen IMU.
      articulation_sleep_threshold: 0.0
      articulation_stabilization_threshold: 0.0
      # Downlink each wheel's mean contact force over the interval, not one physics step's reading.
      contact_force_window: true
      # motor_encoder carries each wheel's measured speed averaged over the interval, in place of
      # the drive joint angle, which aliased at driving speed when sampled at 1 Hz.
      wheel_speed_window: true
      # The usd gives each wheel 100 kg, 59% of the rover's 1025 kg. 25 kg per wheel, the difference
      # moved into the body: the total stays 1025 kg. Not lighter: with 5 kg wheels the wheel speed
      # jittered 3-4x more under the 30 Hz physics step and the unchanged drive gains (tested
      # 2026-10-11), which blew up the EKF's wheel and tracking residuals.
      link_masses:
        wheel_front_left: 25.0
        wheel_front_right: 25.0
        wheel_mid_left: 25.0
        wheel_mid_right: 25.0
        wheel_rear_left: 25.0
        wheel_rear_right: 25.0
        body: 840.0
      # The usd springs the rocker and bogie pivots back to 0 deg (drive stiffness 4000 and 200), which
      # leaves the chassis nearly rigid: at rest it stood on three wheels. Free pivots, damping kept,
      # limits in degrees.
      free_joints:
        suspension_joint_rocker_left: [-30.0, 30.0]
        suspension_joint_rocker_right: [-30.0, 30.0]
        suspension_joint_bogie_left: [-40.0, 40.0]
        suspension_joint_bogie_right: [-40.0, 40.0]
      # The differential: the two rockers turn equal and opposite, and the body pitches by their mean.
      mimic_joints:
        suspension_joint_rocker_right: {reference: suspension_joint_rocker_left, gearing: 1.0}
    # Four steerable corners (the two mid wheels are fixed) - the real rocker-bogie layout.
    # These are position drives in the usd (stiffness 500, damping 200), so they hold an angle.
    # Their presence is what switches the rover from skid steering to Ackermann.
    steer_joints: [
      "steer_joint_front_left",
      "steer_joint_front_right",
      "steer_joint_rear_left",
      "steer_joint_rear_right"
    ]
    # Measured from rover_with_sensors.usd, UNSCALED. RoverGeometry.from_config multiplies the
    # lengths by `scale` above, so changing --scale cannot leave the controller working from
    # stale dimensions. Offsets are relative to the mid axle; +x is left, +y is FORWARD.
    #
    # NOTE the longitudinal offsets are negated relative to the raw usd values. `--calibrate`
    # showed the rover travels along usd -y, so the forward-positive body frame is (x, -y_usd)
    # and the wheels the usd names "front" are the leading ones. With the raw usd signs the
    # leading wheels steer away from the turn and the rover curves the wrong way.
    geometry:
      wheel_radius: 0.2625
      corner_half_track: 1.062
      mid_half_track: 1.184
      front_offset: 1.185     # usd -1.185, negated into the forward-positive frame
      rear_offset: -1.075     # usd +1.075, negated into the forward-positive frame
      max_steer_angle_deg: 75.0
      max_wheel_speed: 20.0     # rad/s at the drive joint; a rate, so never scaled
    drive_control:
      position_tolerance: 0.15        # m, goto arrival radius
      distance_tolerance: 0.05        # m, drive_straight stopping accuracy
      heading_tolerance_deg: 2.0
      turn_first_threshold_deg: 90.0  # pivot instead of arcing beyond this heading error
      steering_gain: 1.2              # curvature (1/m) per radian of heading error
      max_curvature: 1.0              # 1/m, tightest commanded arc
      default_speed: 0.3              # m/s used by goto
      default_yaw_rate_deg: 15.0      # deg/s used by goto pivots
      # Sign conventions measured by `--calibrate`: the rover moved 0.462 m with a projection of
      # -0.413 onto body +y, so +y points backward and the heading has to be read off the negated
      # forward vector. steer_sign +1 confirms commanded and measured steer angles agree.
      forward_axis_sign: -1.0
      steer_sign: 1.0
    # Reference torques for fault injection. The usd authors no maxForce on any joint, so a healthy
    # joint is unlimited and there is no nominal for an absolute N*m to be a fraction of. These
    # supply that reference: a fault caps the joint at (1 - severity) * nominal, and clearing a
    # fault restores "unlimited" rather than writing the nominal, so a healthy run is untouched.
    #
    # Sizing at scale 0.35 under lunar gravity, with the usd's authored masses (~1025 kg total) and
    # a 0.0919 m wheel radius: holding a 15 deg slope needs ~6.6 N*m per wheel and accelerating at
    # 0.5 m/s^2 needs ~7.8 N*m, so 20 N*m leaves headroom and puts the interesting range around
    # severity 0.6-0.7. The steer joints already resist ~51 N*m under load (stiffness 500 times the
    # ~0.10 rad tracking error observed), so their nominal has to sit well above that.
    fault_injection:
      nominal_wheel_torque: 20.0   # N*m at the drive joint
      nominal_steer_torque: 150.0  # N*m at the steer joint
      # A stuck wheel multiplies its drive damping (25000 in the usd) by 1 / (1 - severity) and
      # divides its velocity target by the same factor - exactly a passive viscous brake added to a
      # healthy motor. This cap is what severity 1.0 reaches: the wheel keeps 0.1% of its speed.
      max_wheel_stuck_damping_factor: 1000.0
      # Wheel-ground friction of a healthy wheel. The usd binds no physics material, so contacts use
      # the PhysX default (0.5); each wheel gets its own material at this value when the rover loads,
      # and a slip fault lowers it to (1 - severity) * this. Keep it equal to the PhysX default or
      # every healthy run changes.
      nominal_wheel_friction: 0.5
      # A sunk wheel settles severity * max_wheel_sinkage_m into the ground (a negative collider rest
      # offset) and is pushed against its horizontal motion by severity * max_sink_resistance_coeff
      # times its normal load, every physics step. 0.03 m is about a third of the 0.0919 m wheel
      # radius. The coefficient sits above the 0.5 friction on purpose: with ALL wheels at 1.0 the
      # soil drags harder than the wheels can grip, so they spin and the rover stalls. Below
      # sink_resistance_velocity_eps the drag fades to zero rather than flipping sign each step.
      max_wheel_sinkage_m: 0.03
      max_sink_resistance_coeff: 0.6
      sink_resistance_velocity_eps: 0.05  # m/s
      # The same idea for the non-actuator faults: each value is what severity 1.0 means. They only
      # ever size a fault - a healthy sensor, battery or link never sees them.
      max_imu_accel_bias: 2.0            # m/s^2 constant offset on every accelerometer axis
      max_imu_gyro_bias: 0.5             # rad/s constant offset on every gyro axis
      max_imu_orientation_bias_deg: 20.0 # deg offset on roll/pitch/yaw; this is what reaches the
                                         # power and thermal models, which use imu yaw for the sun
      max_imu_accel_noise: 1.0           # m/s^2, one sigma
      max_imu_gyro_noise: 0.2            # rad/s, one sigma
      max_camera_noise: 80.0             # counts of 255, one sigma, on the colour channels only
      max_parasitic_load_w: 40.0         # W drawn straight off a 60 Wh pack: visible within minutes
    # Onboard navigation EKF (src/mission_specific/perseverance/estimation/). Estimates the rover's
    # motion from its own sensors and downlinks per-sensor residuals under /Rover/estimator.
    # FITTED by scripts/fit_nav_estimator.py on 14 nominal 600 s episodes (2026-10-11, dataset seed
    # 300, my_files/nav_refit), after the physics change (free rocker-bogie, 25 kg wheels, sleep off).
    # Replay NIS: wheels 1.06, gyro 1.02, heading 0.81. CUSUM thresholds: 1.5x the nominal peak per
    # residual. Refit after changing the rover, terrain or physics:
    #   run_perseverance.py --headless --dataset-out DIR --estimator-dump DIR (nominal episodes only)
    #   python3 scripts/fit_nav_estimator.py DUMP_DIR --out fit.yaml
    # imu.forward/left: the rover's axes in the imu frame. wheel_yaw_scale: wheels see 1.054x the true
    # yaw rate (scrub). torque_model: least squares on the measured joint force; per-sample R^2 is only
    # 0.12-0.30, the residual is used through 1 s windows and the CUSUM. The rear wheels lag their
    # command by a steady +0.6 sigma on nominal driving, so wheel_tracking.rear_* thresholds are ~200.
    estimator:
      enabled: true
      imu:
        forward: [-0.0, -1.0, -0.0]
        left: [1.0, 0.0, 0.0]
      process_noise: {sigma_accel: 0.278752, q_omega: 0.00278, q_heading: 6.93e-06, q_gyro_bias: 1.0e-06,
        q_accel_bias: 1.0e-05, q_odometry: 0.00299}
      measurement_noise: {sigma_wheel: 0.021986, sigma_sideslip: 0.006614, sigma_gyro: 0.011699,
        sigma_heading: 0.000825, sigma_yaw_scale: 0.2}
      gate: 10.828
      max_gated_wheels: 2
      reacquire_s: 3.0
      window_s: 1.0
      tracking_sigma: 0.209852
      cusum:
        drift: 0.5
        threshold: 10.0
        window_sigma: {wheel_rolling.front_left: 0.490054, wheel_rolling.front_right: 0.474572,
          wheel_rolling.mid_left: 0.456765, wheel_rolling.mid_right: 0.437011, wheel_rolling.rear_left: 0.513933,
          wheel_rolling.rear_right: 0.495306, wheel_sideslip.front_left: 0.885067, wheel_sideslip.front_right: 0.91025,
          wheel_sideslip.mid_left: 0.286755, wheel_sideslip.mid_right: 0.286755, wheel_sideslip.rear_left: 0.88942,
          wheel_sideslip.rear_right: 0.879966, wheel_effort.front_left: 0.407199, wheel_effort.front_right: 0.404295,
          wheel_effort.mid_left: 0.3904, wheel_effort.mid_right: 0.395453, wheel_effort.rear_left: 0.303177,
          wheel_effort.rear_right: 0.304583, wheel_tracking.front_left: 0.24241, wheel_tracking.front_right: 0.245481,
          wheel_tracking.mid_left: 0.199013, wheel_tracking.mid_right: 0.193689, wheel_tracking.rear_left: 0.275766,
          wheel_tracking.rear_right: 0.257608, gyro: 0.480784, heading: 0.77707, lateral_force: 0.074599}
        thresholds: {wheel_rolling.front_left: 29.9, wheel_rolling.front_right: 31.31,
          wheel_rolling.mid_left: 28.9, wheel_rolling.mid_right: 30.48, wheel_rolling.rear_left: 28.32,
          wheel_rolling.rear_right: 29.66, wheel_sideslip.front_left: 26.17, wheel_sideslip.front_right: 29.54,
          wheel_sideslip.mid_left: 43.99, wheel_sideslip.mid_right: 43.99, wheel_sideslip.rear_left: 39.7,
          wheel_sideslip.rear_right: 48.5, wheel_effort.front_left: 36.86, wheel_effort.front_right: 35.57,
          wheel_effort.mid_left: 44.13, wheel_effort.mid_right: 41.11, wheel_effort.rear_left: 23.82,
          wheel_effort.rear_right: 22.74, wheel_tracking.front_left: 27.73, wheel_tracking.front_right: 49.77,
          wheel_tracking.mid_left: 17.92, wheel_tracking.mid_right: 16.82, wheel_tracking.rear_left: 226.59,
          wheel_tracking.rear_right: 194.36, gyro: 43.42, heading: 38.0, lateral_force: 39.94}
      torque_model:
        coefficients:
          front_left: [9.437029, 4.964284, -1.420362, 0.551823, -3.96822]
          front_right: [9.651406, 5.432974, -1.562787, 0.490764, -1.740508]
          mid_left: [3.233078, 2.201386, -0.119874, 0.346741, -1.602938]
          mid_right: [3.06983, 1.926346, -0.077619, 0.361183, -1.624353]
          rear_left: [19.235378, 1.949363, 2.013035, 0.167435, 4.77219]
          rear_right: [17.971958, 1.937641, 1.913916, 0.174077, 2.516918]
        sigma: {front_left: 6.907156, front_right: 6.898207, mid_left: 5.091666, mid_right: 4.792364,
          rear_left: 11.744434, rear_right: 11.480014}
      wheel_yaw_scale: 1.05409
    # Fault-detection dataset generation (--dataset-out). Everything here only shapes the sampling;
    # the faults themselves go through the same inject_* methods a ground-control command reaches,
    # so a dataset fault and an operator's fault are the same fault. See
    # src/mission_specific/perseverance/dataset/.
    dataset:
      camera_resolution: "low"   # a key of parameters.camera.resolutions above
      episode:
        episode_steps: 18000      # 600 s of simulation at the 33 ms physics step
        render_every_step: false  # true renders every step (slow); --render-every-step sets it
        # Otherwise nothing renders until a nav-cam frame is due, and then the renderer is warmed up
        # this many times AT THE CAPTURE POSE (world.render() does not step physics). Too few and the
        # frame still carries the previous capture's scene in its accumulation history.
        # --render-warmup-frames overrides it; compare against --render-every-step after changing it.
        render_warmup_frames: 8
        downlink_period_s: 1.0    # matches yamcs_tmtc.intervals.robot_stats
        image_period_s: 5.0       # matches yamcs_tmtc.camera_downlink.period
        settle_steps: 30          # after the teleport, before the first row is recorded
        landing_hold_s: 3.0       # the settle lasts at least this long, so the rover has landed
                                  # before the first command
        spawn_clearance_m: 0.15   # placed this far above the highest ground under it, not dropped
                                  # from 3 m, which could flip the rover on landing
        spawn_jitter_m: 3.0       # how far an episode's start wanders from the pose above
        rocks_per_episode: 8
        # Initial state, sampled per episode so no channel counts time from a fixed start. See the
        # initial-state block of DEFAULTS in dataset/episode_runner.py; meta.json records the draws.
        preroll_s: [0.0, 60.0]            # driven before t=0, not recorded
        battery_soc_range: [0.5, 1.0]     # state of charge at the start
        thermal_history_s: 1800.0         # faces warmed by this much driving at random headings,
        thermal_heading_hold_s: [10.0, 60.0]  # each held this long; the last is the current heading
        obc_uptime_range_s: [1800.0, 259200.0]  # 30 min to 3 days since boot
        estimator_origin_m: 50.0          # radius of the filter's starting position in its frame
        estimator_reacquisition_rate_hz: 0.0067  # counts accumulated since boot, Poisson
      faults:
        # Episode mix. Majority nominal because a detector needs negatives, and overlap kept rare
        # because simultaneous faults are the unusual case - about 9% of episodes at these weights.
        class_weights:
          nominal: 0.60
          single: 0.28
          concurrent: 0.09    # two faults overlapping in time
          sequential: 0.03    # one recovers, then another begins
          crater: 0.15        # only with --crater; ignored otherwise
        # Merged into the defaults rather than replacing them, so zero a kind to exclude it.
        kind_weights:
          wheel_torque: 1.0
          wheel_stuck: 1.0
          wheel_slip: 1.0
          wheel_sink: 1.0
          steer_torque: 1.0
          steer_stuck: 0.7
          imu: 1.0
          camera: 1.0
          battery: 1.0
          comms: 1.0
        # Onsets are uniform in [onset_min_s, onset_max * episode]: every faulted episode keeps a
        # clean lead-in and some faulted regime - a fault starting at t=0 would teach a classifier
        # to recognise a regime rather than to detect anything.
        onset_min_s: 10.0
        onset_max: 0.90
        # Severities start well above zero: a fault too weak to have an effect is a mislabelled
        # nominal episode, which is worse than no episode at all.
        severity_range: [0.50, 1.00]
        steer_stuck_angle_deg: [10.0, 45.0]
        recovery_probability: 0.25
        all_targets_probability: 0.15
      # Steep-crater scenario (--crater). See src/mission_specific/perseverance/dataset/crater.py.
      # Walls steeper than atan(0.5) = 26.6 deg cannot be climbed at the 0.5 wheel friction; above
      # ~45 deg the rover tends to tumble rather than slide in. Depth keeps the wall longer along the
      # slope than the ~0.8 m rover, so it cannot bridge the lip. Bounds and resolution come from the
      # environment at launch.
      crater:
        floor_radius_m: [1.0, 2.0]
        wall_slope_deg: [30.0, 45.0]
        depth_m: [0.7, 1.1]
        rim_height_fraction: [0.0, 0.12]
        axis_ratio: [0.9, 1.0]
        roughness_m: [0.0, 0.02]
        spawn_rim_distance_m: [2.5, 5.0]
        # trapped: dash over the rim. avoid: never approach. skirt: pass just outside the rim.
        # avoid and skirt are the negatives that stop a detector keying on "a crater is in view".
        outcome_weights: {trapped: 0.7, avoid: 0.15, skirt: 0.15}
        dash_window: [0.35, 0.60]
        keep_out_margin_m: 1.5
        skirt_margin_m: [0.4, 1.2]
        escape_timeout_s: [20.0, 45.0]
        fault_probability: 0.3     # a crater episode may also carry one injected fault
        entry_margin_m: 0.3        # in_crater once the base is this far inside the rim
      mission:
        waypoint_radius_m: 8.0
        min_leg_m: 2.5
        command_weights:
          goto: 0.6
          drive_straight: 0.25
          drive_turn: 0.15
        inter_command_pause_s: 2.0
        # Rare subsystem commands between legs, each undone after a sampled hold.
        # Per-episode chance for each command: 0.05 is once every 20 episodes; 0 turns it off.
        housekeeping_episode_probability:
          power_electronics: 0.05
          deploy_solar_panel: 0.05
        housekeeping_window_s: [30.0, 420.0]
        power_off_devices:
          MOTOR_CONTROLLER: 0.6
          CAMERA: 0.4
        power_off_range_s: [15.0, 60.0]
        stow_range_s: [30.0, 120.0]
    # dimensions feeds DriveHandler's skid-steer turn maths, which the Ackermann controller
    # replaces. Kept accurate anyway: width is the measured mid-wheel track at scale 0.35.
    dimensions:
      width: 0.829 # m
      length: 0.791
    turn_speed_coef: 10.88  # 1 / wheel_radius at scale 0.35; unused on the Ackermann path
    pos_relative_to_prim: ""
    camera:
      prim_path: "/World/perseverance/body/nav_cam"
      resolutions:
        low: [320, 240]
        high: [1440, 1080]
    imu_sensor_path: "/World/perseverance/body/imu"
    solar_panel_joint: "" # the perseverance usd has no articulated solar panel
