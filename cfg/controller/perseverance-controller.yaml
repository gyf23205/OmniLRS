# @package environment
# do not remove the above comment, it injects the below configs into environment configs

robots_settings:
  robot_controller: "perseverance-controller"
  yamcs_tmtc: # these settings are relevant if Yamcs mode
    mdb:
      # NOTE: load perseverance.xml alone. MdbParsingService.load_mdb_registry raises on ambiguous
      # wire names across files, and rover.xml declares commands with the same names.
      - "cfg/mdb/perseverance.xml"
    intervals:
      # Downlink period in seconds. This is what makes telemetry low-rate: the physics loop runs at
      # ~30 Hz, the rover state reaches the ground once per second.
      robot_stats: 1
    images:
      # One nav-cam bucket. The frame is uploaded through the Yamcs storage api rather than shared
      # on disk, so the two containers need not agree about /tmp.
      no_data_image_path: ""
      buckets:
        - name: "images_navcam"
          path: "/Rover/camera/images_navcam"
    camera_downlink:
      bucket: "images_navcam"
      resolution: "low"   # a key of parameters.camera.resolutions in the robot config
      # Seconds of simulation time. Deliberately far slower than the 1 Hz parameter downlink:
      # images are the one thing a real low-rate link genuinely cannot afford.
      period: 5
    parameters:
      pose_of_base_link: "/Rover/pose_ground_truth"
      imu_accelerometer: "/Rover/imu_accelerometer"
      imu_gyroscope: "/Rover/imu_gyroscope"
      imu_orientation: "/Rover/imu_orientation"
      motor_encoder: "/Rover/motor_encoder"
      motor_effort: "/Rover/motor_effort"
      steer_encoder: "/Rover/steer_encoder"
      contact_force_front_left: "/Rover/contact_force_front_left"
      contact_force_front_right: "/Rover/contact_force_front_right"
      contact_force_mid_left: "/Rover/contact_force_mid_left"
      contact_force_mid_right: "/Rover/contact_force_mid_right"
      contact_force_rear_left: "/Rover/contact_force_rear_left"
      contact_force_rear_right: "/Rover/contact_force_rear_right"
      battery_charge: "/Rover/battery_charge"
      battery_voltage: "/Rover/battery_voltage"
      total_current_in: "/Rover/total_current_in"
      total_current_out: "/Rover/total_current_out"
      net_power: "/Rover/net_power"
      motor_current: "/Rover/motor_current"
      current_draw_obc: "/Rover/current_draw_obc"
      current_draw_motor_controller: "/Rover/current_draw_motor_controller"
      current_draw_camera: "/Rover/current_draw_camera"
      current_draw_radio: "/Rover/current_draw_radio"
      current_draw_eps: "/Rover/current_draw_eps"
      temperature_front: "/Rover/temperature_front"
      temperature_back: "/Rover/temperature_back"
      temperature_left: "/Rover/temperature_left"
      temperature_right: "/Rover/temperature_right"
      temperature_top: "/Rover/temperature_top"
      temperature_bottom: "/Rover/temperature_bottom"
      rssi: "/Rover/radio_rssi"
      obc_state: "/Rover/obc_state"
      obc_cpu_usage: "/Rover/obc_cpu_usage"
      obc_ram_usage: "/Rover/obc_ram_usage"
      obc_disk_usage: "/Rover/obc_disk_usage"
      obc_uptime: "/Rover/obc_uptime"
      go_nogo: "/Rover/go_nogo"
      solar_panel_state: "/Rover/solar_panel_state"
      active_command: "/Rover/active_command"
      command_status: "/Rover/command_status"
      command_distance_remaining: "/Rover/command_distance_remaining"
      command_heading_error: "/Rover/command_heading_error"
      command_target: "/Rover/command_target"
      # Injected faults. Kept on their own /Rover/faults path so nothing artificial can be read as
      # a real rover measurement.
      faults_active: "/Rover/faults/active"
      wheel_torque_limit: "/Rover/faults/wheel_torque_limit"
      wheel_damping_factor: "/Rover/faults/wheel_damping_factor"
      wheel_friction: "/Rover/faults/wheel_friction"
      wheel_sinkage: "/Rover/faults/wheel_sinkage"
      steer_torque_limit: "/Rover/faults/steer_torque_limit"
      # Ground-truth health, straight from the injector - no detection logic involved.
      wheel_health: "/Rover/faults/wheel_health"
      steer_health: "/Rover/faults/steer_health"
      motor_controller_health: "/Rover/faults/motor_controller_health"
      imu_health: "/Rover/faults/imu_health"
      camera_health: "/Rover/faults/camera_health"
      battery_health: "/Rover/faults/battery_health"
      comms_health: "/Rover/faults/comms_health"
      parasitic_load: "/Rover/faults/parasitic_load"
      dropped: "/Rover/faults/dropped"
      # Onboard navigation filter. Computed from the rover's own sensors: observable, not oracle.
      estimator_pose: "/Rover/estimator/pose"
      estimator_motion: "/Rover/estimator/motion"
      estimator_bias: "/Rover/estimator/bias"
      estimator_imu_residual: "/Rover/estimator/imu_residual"
      estimator_nis: "/Rover/estimator/nis"
      estimator_wheel_rolling_mean: "/Rover/estimator/wheel_rolling_mean"
      estimator_wheel_rolling_max: "/Rover/estimator/wheel_rolling_max"
      estimator_wheel_sideslip_mean: "/Rover/estimator/wheel_sideslip_mean"
      estimator_wheel_sideslip_max: "/Rover/estimator/wheel_sideslip_max"
      estimator_wheel_effort_mean: "/Rover/estimator/wheel_effort_mean"
      estimator_wheel_effort_max: "/Rover/estimator/wheel_effort_max"
      estimator_wheel_tracking_mean: "/Rover/estimator/wheel_tracking_mean"
      estimator_wheel_tracking_max: "/Rover/estimator/wheel_tracking_max"
      estimator_cusum_alarm: "/Rover/estimator/cusum_alarm"
      estimator_reacquisitions: "/Rover/estimator/reacquisitions"
    commands:
      drive_straight: "/Rover/motor/drive_straight"
      drive_turn: "/Rover/motor/drive_turn"
      stop: "/Rover/motor/stop"
      goto: "/Rover/motor/goto"
      power_electronics: "/Rover/system/power_electronics"
      solar_panel: "/Rover/system/deploy_solar_panel"
      go_nogo: "/Rover/system/go_nogo"
      # Simulation backdoor, not flight commands. See src/mission_specific/perseverance/faults/.
      inject_wheel_torque_fault: "/Rover/faults/inject_wheel_torque_fault"
      inject_wheel_stuck_fault: "/Rover/faults/inject_wheel_stuck_fault"
      inject_wheel_slip_fault: "/Rover/faults/inject_wheel_slip_fault"
      inject_wheel_sink_fault: "/Rover/faults/inject_wheel_sink_fault"
      inject_steer_torque_fault: "/Rover/faults/inject_steer_torque_fault"
      inject_steer_stuck_fault: "/Rover/faults/inject_steer_stuck_fault"
      inject_imu_fault: "/Rover/faults/inject_imu_fault"
      inject_camera_fault: "/Rover/faults/inject_camera_fault"
      inject_battery_fault: "/Rover/faults/inject_battery_fault"
      inject_comms_fault: "/Rover/faults/inject_comms_fault"
      clear_faults: "/Rover/faults/clear_faults"
